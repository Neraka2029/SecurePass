<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurePass</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-logo">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,7C13.4,7 14.8,8.6 14.8,10V11.4C15.4,11.4 16,12 16,12.6V16.6C16,17.2 15.4,17.8 14.8,17.8H9.2C8.6,17.8 8,17.2 8,16.6V12.6C8,12 8.6,11.4 9.2,11.4V10C9.2,8.6 10.6,7 12,7M12,8.2C11.2,8.2 10.4,8.7 10.4,10V11.4H13.6V10C13.6,8.7 12.8,8.2 12,8.2Z"/>
        </svg>
      </div>
      <div class="popup-title">
        <img src="src/logo.png" alt="SecurePass" width="150">
      </div>
      <p class="popup-subtitle">Gestionnaire de mots de passe</p>
    </div>

    <div class="popup-content">
      <div class="status-section" id="status-section">
        <div class="status-indicator" id="status-indicator">
          <div class="status-dot"></div>
          <span id="status-text">Vérification...</span>
        </div>
      </div>

      <div class="actions-section">
        <button class="popup-btn popup-btn-primary" id="open-website-btn">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M14,3V5H17.59L7.76,14.83L9.17,16.24L19,6.41V10H21V3M19,19H5V5H12V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19Z"/>
          </svg>
          Ouvrir SecurePass
        </button>

        <button class="popup-btn popup-btn-secondary" id="generate-password-btn">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/>
          </svg>
          Générer un mot de passe
        </button>
      </div>

      <div class="password-generator" id="password-generator" style="display: none;">
        <div class="password-display">
          <input type="text" id="generated-password" readonly>
          <button class="copy-btn" id="copy-password-btn" title="Copier">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/>
            </svg>
          </button>
        </div>
        
        <div class="password-options">
          <div class="option-group">
            <label for="password-length">Longueur: <span id="length-value">16</span></label>
            <input type="range" id="password-length" min="8" max="16" value="16">
          </div>
        </div>
        
        <button class="popup-btn popup-btn-accent" id="regenerate-btn">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/>
          </svg>
          Régénérer
        </button>
      </div>
    </div>

    <div class="popup-footer">
      <div class="footer-links">
        <a href="#" id="help-link">Aide</a>
        <a href="#" id="settings-link">Paramètres</a>
      </div>
      <div class="footer-version">
        v1.0.0
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
